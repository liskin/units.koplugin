name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install busted
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit lua-busted

      - name: Test
        run: |
          just test
